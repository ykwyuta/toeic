<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#102439">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png">
<title>TOEIC L&amp;R 模擬問題</title>
<style>
* { box-sizing: border-box; }
:root { color-scheme: light; font: 100%/1.65 system-ui, sans-serif; color: #13273b; background: #edf2f7; }
body { margin: 0; }
main { max-width: 68rem; margin: auto; padding: clamp(1rem, 4vw, 3rem); }
[hidden] { display: none !important; }
.hero { position: relative; isolation: isolate; overflow: hidden; border-radius: 1.5rem; padding: clamp(1.6rem, 6vw, 4.25rem); color: #f6f9ff; background: radial-gradient(ellipse at 85% 30%, #284d66, transparent 62%), #102439; }
.hero::before { content: ""; position: absolute; inset: 0; z-index: -1; background: repeating-linear-gradient(126deg, transparent 0 2.4rem, #aacfe512 2.4rem calc(2.4rem + 1px)); mask-image: linear-gradient(90deg, transparent 10%, #000); }
.hero-brand { display: flex; align-items: center; gap: .75rem; color: #d1deea; font-size: .9rem; }
.hero-brand img { border-radius: .65rem; outline: 1px solid #a4bbce60; }
h1 { margin: 2rem 0 .85rem; font-size: clamp(2.5rem, 8.2vw, 6.25rem); line-height: .98; letter-spacing: -.075em; }
h1 span { display: block; margin-top: .75rem; font-size: .46em; letter-spacing: -.04em; }
.hero p { margin: 1.25rem 0; color: #d1deea; }
.hero-actions { display: flex; flex-wrap: wrap; align-items: center; gap: .65rem 1.3rem; }
.hero-actions button { background: #ffad69; border-color: #ffad69; color: #102439; font-weight: 750; }
.hero-actions a { color: #eef6ff; text-underline-offset: .3em; }
#practice { max-width: 46rem; margin: 1.5rem auto; }
.settings { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 23rem), 1fr)); margin-top: 1rem; }
fieldset, .settings section { background: #fff; border: 1px solid #c3d0dd; border-radius: 1rem; padding: 1.25rem; min-width: 0; }
fieldset { margin: 0 0 1rem; }
h2 { margin: 0 0 .75rem; font-size: 1.25rem; }
legend { font-weight: 700; padding-inline: .35rem; }
label { display: block; padding: .35rem 0; }
button, input { font: inherit; max-width: 100%; }
button { padding: .55rem .9rem; border: 1px solid #124d75; border-radius: .55rem; background: #124d75; color: white; cursor: pointer; }
button:disabled { opacity: .65; cursor: default; }
#back { margin-bottom: 1rem; color: #124d75; background: transparent; }
:focus-visible { outline: 3px solid #cf571c; outline-offset: 3px; }
</style>
<main>
<header class="hero" id="start-screen">
  <div class="hero-brand"><img src="./icon-192.png" alt="" width="44" height="44">非公式学習教材</div>
  <h1 lang="en">TOEIC L&amp;R<span lang="ja">模擬問題</span></h1>
  <p>Part 5 · 短文穴埋め 3問</p>
  <div class="hero-actions">
    <button id="start" type="button">問題を始める</button>
    <a href="#learning-history">学習履歴を見る</a>
  </div>
</header>
<section id="practice" aria-labelledby="practice-title" hidden>
  <h2 id="practice-title" tabindex="-1">Part 5 · 短文穴埋め</h2>
  <button id="back" type="button">開始画面に戻る</button>
  <form id="exam">
    <div id="items"></div>
    <button>採点する</button>
  </form>
  <p id="result" role="status"></p>
</section>
<div class="settings">
<section id="learning-history" tabindex="-1">
  <h2>学習履歴</h2>
  <p>履歴はこのブラウザに保存されます。別の端末ではJSONファイルを読み込んで引き継げます。</p>
  <button id="download" type="button">履歴をダウンロード</button>
  <label for="upload">履歴を読み込む</label>
  <input id="upload" type="file" accept=".json,application/json">
  <p id="status" role="status"></p>
  <ul id="history"></ul>
</section>
<section>
  <h2>オフライン利用</h2>
  <p id="offline-status" role="status">オフラインの準備状況を確認しています。</p>
  <button id="offline-reset" type="button" disabled>キャッシュを強制削除して再取得</button>
</section>
</div>
</main>
<script>
'use strict';
const questions = [
  {
    stem: 'The warehouse will remain closed _____ the safety inspection is complete.',
    choices: ['during', 'until', 'despite', 'within'],
    answer: 1,
    explanation: 'until は「〜するまで」を表し、後ろの主語と動詞を含む節を取れます。during・despite・within はこの位置でその節を直接取れません。'
  },
  {
    stem: 'Please _____ the conference room by noon if you need it for tomorrow’s workshop.',
    choices: ['reservation', 'reserved', 'reserving', 'reserve'],
    answer: 3,
    explanation: 'Please に続く命令文には動詞の原形 reserve が入ります。reservation は名詞、reserved は過去形・過去分詞、reserving は -ing 形です。'
  },
  {
    stem: 'We have extended the registration _____ to give applicants more time to submit their forms.',
    choices: ['deadline', 'receipt', 'summary', 'fee'],
    answer: 0,
    explanation: '提出時間を増やすために延長するものは deadline（締め切り）です。receipt は領収書、summary は要約、fee は料金で、いずれも提出期限を表しません。'
  }
];
const key = 'toeic.history.v1';
const examId = 'part5-demo';
const revision = 1;
const select = (id) => document.getElementById(id);

select('start').addEventListener('click', () => {
  select('start-screen').hidden = true;
  select('practice').hidden = false;
  select('practice-title').focus();
});

select('back').addEventListener('click', () => {
  select('practice').hidden = true;
  select('start-screen').hidden = false;
  select('start').focus();
});

const dateFormat = new Intl.DateTimeFormat('ja-JP', { dateStyle: 'medium', timeStyle: 'short' });
const letter = (index) => 'ABCD'[index];
const score = (answers) => answers.filter((value, index) => value === questions[index].answer).length;

function validate(data) {
  if (!data || data.version !== 1 || !Array.isArray(data.attempts)) throw new Error('履歴の形式に対応していません。');
  const seen = new Set();
  for (const attempt of data.attempts) {
    if (!attempt || typeof attempt.id !== 'string' || !/^[0-9a-f-]{36}$/i.test(attempt.id) ||
        seen.has(attempt.id) || attempt.examId !== examId || attempt.revision !== revision ||
        typeof attempt.finishedAt !== 'string' || !Number.isFinite(Date.parse(attempt.finishedAt)) ||
        !Array.isArray(attempt.answers) || attempt.answers.length !== questions.length ||
        !attempt.answers.every((value, index) => Number.isInteger(value) && value >= 0 && value < questions[index].choices.length)) {
      throw new Error('履歴に無効な受験データがあります。');
    }
    seen.add(attempt.id);
  }
  return data.attempts.map(({ id, finishedAt, answers }) => ({ id, examId, revision, finishedAt, answers }));
}

function load() {
  const raw = localStorage.getItem(key);
  return raw === null ? [] : validate(JSON.parse(raw));
}

function save(attempts) {
  localStorage.setItem(key, JSON.stringify({ version: 1, attempts }));
}

function renderHistory(attempts) {
  const rows = attempts.slice().sort((a, b) => Date.parse(b.finishedAt) - Date.parse(a.finishedAt)).map((attempt) => {
    const row = document.createElement('li');
    row.textContent = dateFormat.format(new Date(attempt.finishedAt)) + ' · ' + score(attempt.answers) + ' / ' + questions.length + ' 問正解';
    return row;
  });
  select('history').replaceChildren(...rows);
  select('download').disabled = !rows.length;
  if (!rows.length) select('status').textContent = '保存された履歴はありません。';
}

function refresh() {
  try {
    select('status').textContent = '';
    renderHistory(load());
  } catch {
    select('download').disabled = true;
    select('status').textContent = 'ブラウザの履歴を読み込めませんでした。';
  }
}

select('items').innerHTML = questions.map((question, index) =>
  '<fieldset><legend>問題 ' + (index + 1) + '</legend><p lang="en">' + question.stem + '</p>' +
  question.choices.map((choice, option) => '<label lang="en"><input type="radio" required name="q' + index +
    '" value="' + option + '"> ' + letter(option) + '. ' + choice + '</label>').join('') +
  '<p hidden id="explanation-' + index + '"></p></fieldset>').join('');

select('exam').addEventListener('submit', (event) => {
  event.preventDefault();
  const formData = new FormData(event.currentTarget);
  const answers = questions.map((_, index) => Number(formData.get('q' + index)));
  select('result').textContent = score(answers) + ' / ' + questions.length + ' 問正解';
  questions.forEach((question, index) => {
    const explanation = select('explanation-' + index);
    explanation.textContent = '正答 ' + letter(question.answer) + '。' + question.explanation;
    explanation.hidden = false;
  });
  try {
    const attempts = load();
    attempts.push({ id: crypto.randomUUID(), examId, revision, finishedAt: new Date().toISOString(), answers });
    save(attempts);
    renderHistory(attempts);
    select('status').textContent = '採点結果を保存しました。';
  } catch {
    select('status').textContent = '採点結果を保存できませんでした。';
  }
});

select('download').addEventListener('click', () => {
  try {
    const blob = new Blob([JSON.stringify({ version: 1, attempts: load() }, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = 'toeic-history.json';
    link.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  } catch {
    select('status').textContent = '履歴を書き出せませんでした。';
  }
});

select('upload').addEventListener('change', async (event) => {
  const input = event.currentTarget;
  const file = input.files[0];
  if (!file) return;
  try {
    const incoming = validate(JSON.parse(await file.text()));
    const attempts = load();
    const known = new Set(attempts.map(({ id }) => id));
    const additions = incoming.filter(({ id }) => !known.has(id));
    const merged = attempts.concat(additions);
    save(merged);
    renderHistory(merged);
    select('status').textContent = additions.length + '件の履歴を追加しました。';
  } catch {
    select('status').textContent = '履歴を読み込めませんでした。書き出したJSONファイルを選んでください。';
  } finally {
    input.value = '';
  }
});

window.addEventListener('storage', (event) => {
  if (event.key === key || event.key === null) refresh();
});
refresh();

const offlineStatus = select('offline-status');
const offlineReset = select('offline-reset');

function sendOfflineCommand(worker, command) {
  return new Promise((resolve, reject) => {
    const channel = new MessageChannel();
    const timeout = setTimeout(() => {
      channel.port1.close();
      reject(new Error('Service worker did not respond.'));
    }, 15000);
    channel.port1.onmessage = ({ data }) => {
      clearTimeout(timeout);
      channel.port1.close();
      resolve(data);
    };
    worker.postMessage(command, [channel.port2]);
  });
}

if ('serviceWorker' in navigator && 'caches' in window) {
  const workers = navigator.serviceWorker;

  async function showOfflineStatus() {
    if (!workers.controller || offlineReset.dataset.busy) return;
    offlineReset.disabled = false;
    try {
      const { ready } = await sendOfflineCommand(workers.controller, 'offline-status');
      if (offlineReset.dataset.busy) return;
      offlineStatus.textContent = ready
        ? 'オフラインで利用できます。'
        : 'キャッシュがありません。接続して再取得してください。';
    } catch {
      offlineStatus.textContent = 'オフラインの準備状況を確認できませんでした。';
    }
  }

  workers.addEventListener('controllerchange', showOfflineStatus);
  workers.register('./sw.js', { updateViaCache: 'none' }).then(showOfflineStatus).catch(() => {
    offlineStatus.textContent = 'オフラインの準備に失敗しました。接続してページを開き直してください。';
  });

  offlineReset.addEventListener('click', async () => {
    const worker = workers.controller;
    if (!worker) return;
    offlineReset.disabled = true;
    offlineReset.dataset.busy = 'true';
    offlineStatus.textContent = 'キャッシュを削除し、ページを再取得しています。学習履歴は保持されます。';
    try {
      const { ready, deleted } = await sendOfflineCommand(worker, 'offline-reset');
      offlineStatus.textContent = ready
        ? '再取得しました。次にページを開くと反映されます。オフラインで利用できます。'
        : deleted
          ? 'キャッシュを削除しました。オフライン利用を再開するには、接続して再取得してください。'
          : 'キャッシュを削除できませんでした。';
    } catch {
      offlineStatus.textContent = 'キャッシュの処理結果を確認できませんでした。';
    } finally {
      delete offlineReset.dataset.busy;
      offlineReset.disabled = false;
    }
  });
} else {
  offlineStatus.textContent = 'この環境はオフライン保存に対応していません。';
}
</script>
</html>
